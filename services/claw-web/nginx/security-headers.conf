# ส่วนหัวด้านความปลอดภัยของ claw-web — include ใน "ทุก" location
# (nginx ไม่สืบทอด add_header ลงมาสู่ location ที่ประกาศ add_header ของตัวเอง)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# ห้ามส่ง Referer ออกไป — URL ของ callback มี authorization code
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# $csp มาจาก map ใน default.conf.template (ใส่ origin ของ Keycloak + Kong จาก env)
add_header Content-Security-Policy $csp always;
